<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Groove">
<meta name="theme-color" content="#050505"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<style>html,body{background:#050505}</style></head><body>
<meta charset="utf-8">
<title>Octavio Groove</title><style>.brand .brandlogo{display:block;height:22px;width:auto;color:#fff}body.touch .brand .brandlogo{height:20px}#plug header{gap:10px 12px}#plug header .ekey{min-width:46px;padding:7px 8px 6px}@media (min-width:1500px){body.touch .brand{display:block!important}}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500&family=VT323&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one FM-1 style instrument. Engine window top-left (screen + that engine's controls), mod matrix tall on the right,
   LFO / S&H under it, sequencer across the bottom, keyboard or pads docked below. Single deliberate dark look:
   black panels, white legends, old red LED. */
:root{
  --case:#050505; --win:#050505; --panel:#0b0b0b; --panel2:#1c1c1c; --line:#3a3a3a;
  --ink:#f2efe6; --soft:#a8a59d; --led:#ff3b1f; --ledoff:#3d0f08; --white:#f2efe6; --paper:#f2efe6; --paperink:#14110d;
  --hdr:#000; --osc:#000; --gate:#000; --func:#000; --mod:#000; --seq:#000; --grey:#171717; --blue:#171717; --gold:#e9e4d8;
  --f-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",system-ui,sans-serif; --f-screen:"VT323","Courier New",monospace;
  color-scheme:dark;
}
html,body{background:var(--case);color:var(--ink)}
body{font-family:var(--f-body);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{white-space:nowrap;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;font-size:13px;border:1px solid #000;background:#1b1b1b;color:var(--ink);border-radius:4px;padding:7px 12px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #000}
button.on{background:var(--paper);color:var(--paperink);border-color:var(--paper);box-shadow:0 2px 0 #000}
button:focus-visible,select:focus-visible,.knob:focus-visible,.ftrack:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.grow{flex:1}
.hint{font-family:var(--f-label);font-size:12px;color:var(--soft);width:100%;line-height:1.3}

/* ---------- header ---------- */
header{display:flex;flex-wrap:nowrap;align-items:center;gap:10px 14px;margin-bottom:10px}
.brand{font-family:var(--f-label);font-weight:700;font-size:26px;letter-spacing:.14em;line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.3em;color:var(--soft);font-weight:600}
#start{background:#000;border-color:#333}
#start.running{box-shadow:inset 0 -3px 0 var(--led),0 2px 0 #000}
.ekeys{display:flex;flex-wrap:wrap;gap:6px}
.ekey{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 10px 6px;min-width:58px;background:#111}
.ekey i{width:7px;height:7px;border-radius:50%;background:var(--ledoff)}
.ekey.on{background:#111;color:var(--ink);border-color:#000;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #000}
.ekey.on i{background:var(--white);box-shadow:0 0 7px var(--white)}
#masterSlot .ctl{width:64px}

/* ---------- plugin window: a fixed 1600 x 1000 panel, scaled as one piece to fill the screen ---------- */
html,body{height:100%;margin:0;overflow:hidden}
body{padding:0!important}
#plug{position:fixed;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;box-sizing:border-box;padding:10px 12px;display:grid;grid-template-rows:58px minmax(0,1fr) 70px;gap:8px;background:var(--case)}
#plug header{margin:0;flex-wrap:nowrap}
.app{display:grid;min-height:0;gap:10px;grid-template-columns:minmax(0,1fr) 372px}
.colL{display:grid;grid-template-rows:minmax(0,1fr) 236px;gap:10px;min-height:0;min-width:0}
.colR{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px;min-height:0}
.win{background:var(--win);border:1px solid var(--line);border-radius:8px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.win>.wt{flex:none;display:flex;flex-wrap:nowrap;align-items:center;gap:10px;padding:5px 10px;min-height:28px;border-bottom:1px solid var(--line);font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.2em;background:#000}
.win>.wt i{width:6px;height:6px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led);flex:none}
.wsub{font-weight:500;letter-spacing:.06em;color:var(--soft);font-size:12px;white-space:nowrap}
.wscroll{flex:1;min-height:0;overflow:hidden}
.fitwrap.overflow{overflow:auto}
.fit{transform-origin:0 0}
.wb{padding:8px}
.engbody{padding:8px 10px}
.engpage{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.engpage>.sec{flex:1 1 auto;max-width:100%}
.screen{background:#000;border:2px solid #1e1e1e;border-radius:4px;height:46px;width:170px;padding:2px;flex:none;box-shadow:inset 0 0 12px rgba(0,0,0,.9)}
.screen canvas{width:100%;height:100%;display:block}
.seqtabs{display:flex;gap:5px}.seqtabs button{padding:3px 9px;font-size:12px}.seqtabs:empty{display:none}
/* engine bands, labelled with each engine's own section titles */
#engBody.bands>.engpage{display:flex;flex-wrap:wrap;gap:0 12px;align-items:flex-start}
#subTabs{display:flex;gap:4px;margin-right:10px;flex-wrap:wrap;justify-content:flex-end;max-width:640px}
#subTabs button{font-size:11px;padding:6px 10px;letter-spacing:.1em}
.band{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:9px}
.blabel{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--ink);border:1px solid var(--soft);border-bottom:0;border-radius:4px 4px 0 0;padding:2px 10px;background:#000}
.bbody{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-start;border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:6px 12px;background:var(--panel);max-width:100%;box-sizing:border-box}
.item{display:flex;flex-direction:column;gap:2px;min-width:0}
.item>.cap{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--soft);padding-left:2px}
.item .cols{min-width:520px}
/* sequencer lanes T1..T6 */
.lanes{display:flex;flex-direction:column;gap:5px;padding:8px 10px}
.lane{display:grid;grid-template-columns:26px minmax(0,1fr) 150px 100px 38px 38px;gap:8px;align-items:center;height:27px}
.lane>b{font-family:var(--f-label);font-size:14px;color:var(--soft)}
.lsteps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;height:27px}
.lsteps .step{height:100%}
.lane .ctl.sl{width:auto}.lane .ctl .nm{display:none}
.lane button{padding:0;height:26px;font-size:11px}
.lhead{display:grid;grid-template-columns:30px minmax(0,1fr) 150px 120px 76px;gap:8px;font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--soft)}
/* tempo drag box in the sequencer title */
.dbox{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.08em;background:#000;border:1px solid #3a3a3a;border-radius:3px;padding:2px 9px;cursor:ns-resize;touch-action:none;white-space:nowrap}
/* LFO rows */
.lrows{display:flex;flex-direction:column;gap:5px;width:100%}
.lrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:16px;padding:0 12px;background:var(--panel)}
.lrow>b{width:46px;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--ink)}
.lrow .ctl{flex-direction:row;width:auto;gap:8px}.lrow .ctl .nm{margin:0}
.lrow .knob,.lrow .fwknob{width:34px;height:34px}
.lrow .ctl.sl{width:120px;flex-direction:column}
/* presets */
.presetbox{position:relative}
#presetBtn{background:#000;border-color:var(--line)}
.presetmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:260px;background:#0b0b0b;border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.8)}
.presetmenu .ph{font-family:var(--f-label);font-weight:700;letter-spacing:.16em;font-size:12px;color:var(--soft);display:flex;justify-content:space-between;align-items:center}
.presetmenu .slots{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.presetmenu .slot{text-align:left;font-size:12px;padding:6px 8px;overflow:hidden;text-overflow:ellipsis}
.presetmenu .slot.empty{color:var(--soft)}
.presetmenu .acts{display:flex;gap:5px;flex-wrap:wrap}
/* ---------- panels and controls (shared by every engine) ---------- */
.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.sec h2{margin:0;font-family:var(--f-label);font-size:13px;letter-spacing:.16em;color:var(--ink);padding:5px 10px;border-bottom:1px solid var(--line)}
.sec .in{padding:6px;display:flex;flex-wrap:wrap;gap:6px 4px;align-items:flex-start}
.wide{grid-column:1/-1}
.grp{display:flex;flex-direction:column;gap:2px;min-width:0}
.grp>.cap{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--soft);padding-left:4px;display:flex;align-items:center;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.ctl{width:58px;display:flex;flex-direction:column;align-items:center;font-family:var(--f-label)}
.ctl .nm{font-weight:700;font-size:10.5px;letter-spacing:.06em;text-align:center;line-height:1.1;margin-top:3px;color:var(--soft)}
.ctl .vl{font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.knob{width:44px;height:44px;border-radius:50%;position:relative;touch-action:none;cursor:ns-resize;box-shadow:0 3px 5px rgba(0,0,0,.8),inset 0 0 0 1px #000}
.knob .cap{position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#4a4a4a,#141414 70%);box-shadow:0 1px 2px #000}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:3px;height:19px;margin-left:-1.5px;background:var(--white);border-radius:2px;z-index:1;box-shadow:0 0 0 1px #000}
.ctl.sl{width:100px}
select{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.04em;background:#000;color:var(--ink);border:1px solid #3a3a3a;border-radius:3px;padding:5px 4px;width:100%}
.tog{display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:700;font-size:11.5px;letter-spacing:.06em;cursor:pointer;padding:4px}
.tog i{width:16px;height:16px;border-radius:3px;background:#000;border:1px solid #3a3a3a;display:grid;place-items:center}
.tog i::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ledoff)}
.tog.on i::after{background:var(--led);box-shadow:0 0 6px var(--led)}
.col{display:flex;flex-direction:column;gap:4px;padding:4px;border-right:1px dashed var(--line);min-width:0}
.col:last-child{border-right:0}
.colhead{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-label);font-weight:700;font-size:15px}
.meter{width:30px;height:7px;background:#000;border:1px solid #333;border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--led)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.cols .ctl{width:auto}

.bar{height:24px;background:#1d1d1d;border:1px solid #000;border-radius:3px;position:relative;touch-action:none;cursor:ew-resize}
.bar i{position:absolute;top:3px;bottom:3px;background:var(--white)}
.bar i.neg{background:var(--led)}
.bar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#444}
.steps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;width:100%;height:92px}
.step{background:#1a1a1a;border:1px solid #000;border-radius:3px;position:relative;touch-action:none}
.step:nth-child(4n+1){margin-left:2px}
.step i{position:absolute;left:2px;right:2px;background:var(--white)}
.step i.neg{background:var(--led)}
.step::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#3a3a3a}
.step.now{border:2px solid var(--led)}
.step.uni::before{display:none}
.mat{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:6px;align-items:center;width:100%;font-family:var(--f-label);font-weight:700;font-size:12px}
.mat .mh{font-size:11px;letter-spacing:.16em;color:var(--soft)}
.mat .mn{color:var(--soft);text-align:right}
.mat .ctl.sl{width:auto}
#lfoBody{display:flex;flex-wrap:wrap;gap:6px 10px;align-content:flex-start}
.vleds{display:flex;gap:6px;padding:6px 4px}
.vleds i{width:12px;height:12px;border-radius:50%;background:var(--ledoff)}
.vleds i.on{background:var(--led);box-shadow:0 0 6px var(--led)}
/* faders */
.fad{width:50px}
.ftrack{position:relative;width:10px;height:84px;margin:4px auto 2px;background:#000;border:1px solid #2e2e2e;border-radius:3px;touch-action:none;cursor:ns-resize}
.ftrack i{position:absolute;left:-11px;width:32px;height:14px;background:#f4f2ec;border:1px solid #000;border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.7)}
.ftrack i::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:1px;background:rgba(0,0,0,.75)}
/* CS8 ribbon, VC3 joystick and pin matrix */
.ribbon{position:relative;height:56px;width:100%;background:linear-gradient(#202020,#0b0b0b);border:1px solid #000;border-radius:4px;touch-action:none;display:grid;place-items:center;font-family:var(--f-label);font-size:12px;letter-spacing:.2em;color:var(--soft)}
.ribbon i{position:absolute;top:6px;bottom:6px;width:6px;margin-left:-3px;background:var(--led);border-radius:3px;opacity:0;box-shadow:0 0 8px var(--led)}
.joy{position:relative;width:150px;height:150px;border-radius:10px;background:radial-gradient(circle,#2a2a2a,#0b0b0b);border:1px solid #000;touch-action:none}
.joy i{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#eee,#999);box-shadow:0 2px 4px #000}
.pinwrap{overflow-x:auto;width:100%}
table.pins{border-collapse:collapse;font-family:var(--f-label);font-size:11px}
table.pins th{font-weight:700;color:var(--ink);padding:2px 3px;text-align:center}
table.pins th.rl{text-align:right;white-space:nowrap;padding-right:6px}
table.pins td{padding:1px;text-align:center}
table.pins th.cl{vertical-align:bottom;padding:4px 1px}
table.pins th.cl span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;line-height:1;font-size:10.5px;letter-spacing:.04em}
table.pins tr:hover th.rl,table.pins td:hover{background:rgba(255,255,255,.05)}
.pin{width:20px;height:20px;border-radius:50%;padding:0;background:radial-gradient(circle,#000 30%,#333 34%,#777 70%);border:0;box-shadow:none}
.pin.w{background:radial-gradient(circle at 40% 35%,#fff,#ddd 50%,#888)}
.pin.g{background:radial-gradient(circle at 40% 35%,#9be39f,#3f9a45 55%,#1d5a22)}
/* DR8 pattern grid */
.grid{display:flex;flex-direction:column;gap:4px;width:100%}
.trow{display:grid;grid-template-columns:96px repeat(16,minmax(0,1fr));gap:3px;align-items:center}
.tlab{display:flex;gap:3px;align-items:center;min-width:0}
.tname{flex:1;min-width:0;padding:7px 4px;font-size:11.5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:5px solid var(--kc)}
.mute{width:24px;padding:6px 0;font-size:11px}
.mute.on{background:var(--led);color:#000}
.trow.muted .st{opacity:.35}
.st{height:32px;padding:0;border-radius:3px;border:1px solid #000;background:#262626;min-width:0;box-shadow:none}
.st.q{background:#383838}
.st.on{background:var(--kc)}
.st.acc{background:var(--kc);box-shadow:inset 0 0 0 3px rgba(255,255,255,.9)}
.st.now{outline:2px solid var(--white);outline-offset:1px}
.st.now.on{filter:brightness(1.35)}
.play{min-width:96px;font-size:18px;padding:12px 18px}
.play.on{background:var(--led);color:#000}
.kitb,.trkb{border-bottom:4px solid var(--kc)}
.trkb{font-size:12px;padding:6px 8px}
.hitb{min-width:70px;align-self:center}


/* ---------- bottom strip: keyboard or pads ---------- */
#plug footer{position:static;padding:0;border:0;background:none;min-height:0}
#kbWrap{display:flex;gap:10px;height:100%}
.kbtools{display:flex;flex-direction:column;justify-content:center;gap:6px;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--ink);margin:0}
.kbt{display:flex;gap:6px;align-items:center}
.kbtools button{padding:4px 10px}
.kb{position:relative;flex:1;height:100%;display:flex;touch-action:none}
.kb .w{flex:1;background:#efece5;border:1px solid #000;border-radius:0 0 4px 4px;margin-right:1px}
.kb .b{position:absolute;top:0;height:62%;background:#0b0b0b;border:1px solid #000;border-radius:0 0 3px 3px;z-index:2}
.kb .down{background:var(--led)!important}
.pads{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;height:100%}
.pad{height:100%;border-radius:6px;border:1px solid #000;background:#151515;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;font-size:11px;padding:2px;min-width:0;border-bottom:4px solid var(--kc)}
.pad b{font-size:15px}
.pad span{font-weight:600;letter-spacing:.06em;white-space:nowrap;overflow:hidden;max-width:100%}
.pad.hit{background:var(--kc);color:#000;box-shadow:0 0 14px var(--kc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* firmware knobs: 11 ticks lit up to the value, engine skin, rotating pointer */
.fwknob{width:50px;height:50px;touch-action:none;cursor:ns-resize}
.fwknob svg{width:100%;height:100%;display:block;overflow:visible}
.fwknob .pt{transition:none}

.kbtools button{padding:4px 10px}
/* EASEL: big sliders grouped by section, each page's switches in a strip underneath that scrolls sideways if needed */
.easel{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.emod{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 12px 10px;min-width:0;flex:1 1 auto}
.etitle{font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.16em;color:var(--ink);background:#000;border-bottom:1px solid var(--line);margin:0 -12px;padding:6px 12px;border-radius:8px 8px 0 0;white-space:nowrap}
.efad{display:flex;gap:8px;align-items:flex-start;justify-content:space-around}
.efad .fad{width:72px}
.efad .fad .nm{font-size:12px;white-space:nowrap}
.efad .fad .vl{font-size:12px}
.efad .ftrack{height:210px;width:14px}
.efad .ftrack i{left:-17px;width:46px;height:22px}
.efad .ftrack i::after{top:10px}
.eswstrip{flex:0 0 auto;width:0;min-width:100%;box-sizing:border-box;display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding-bottom:6px;scroll-snap-type:x proximity}
.eswg{flex:none;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 12px 10px;scroll-snap-align:start}
.eswt{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--soft);white-space:nowrap}
.eswr{display:flex;flex-wrap:nowrap;gap:14px;align-items:flex-end}
.esw{width:auto}
.segs{display:flex;flex-direction:row;gap:3px}
.segs button{font-size:12px;padding:7px 10px;letter-spacing:.06em;box-shadow:none;background:#111;color:var(--soft);border:1px solid #2a2a2a}
.segs button.on{background:var(--paper);color:var(--paperink);border-color:var(--paper)}
.eswr .tog{align-self:center}
.sled{display:block;width:9px;height:9px;border-radius:50%;background:var(--ledoff);margin:0 auto 4px}
.sled.on{background:var(--led);box-shadow:0 0 8px var(--led)}
.emod>.meter{height:4px}
body.touch .segs button{min-height:36px;font-size:13px}
.eswstrip::-webkit-scrollbar{height:6px}.eswstrip::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:3px}

.gpb{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.gtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gtools button,.gedit button{min-height:42px;min-width:44px}
.gval{font-family:var(--f-screen);font-size:24px;min-width:34px;text-align:center;color:var(--ink)}
.gsp{width:14px}
.gsteps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:6px}
@media (max-width:1100px){.gsteps{grid-template-columns:repeat(8,minmax(0,1fr))}}
.gstep{position:relative;min-height:96px;padding:6px 4px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;background:#141414;border:1px solid #2c2c2c;border-radius:6px;overflow:visible;letter-spacing:.04em}
.gstep.beat{background:#1b1b1b}
.gstep.hit{background:color-mix(in srgb,var(--tc) 30%,#111);border-color:var(--tc)}
.gstep.sel{box-shadow:0 0 0 2px #fff;z-index:2}
.gstep.out{opacity:.25}
.gstep.now{outline:2px solid #fff;outline-offset:2px}
.gk{font-size:11px;color:var(--soft)}
.gn{font-family:var(--f-label);font-size:15px;font-weight:700;color:#fff;white-space:normal;line-height:1.05;text-align:left;z-index:1}
.gvb{position:absolute;right:4px;top:6px;bottom:6px;width:4px;background:#000;border-radius:2px;display:flex;align-items:flex-end}
.gvb i{display:block;width:100%;background:var(--tc);border-radius:2px}
.gl{position:absolute;left:-1px;bottom:-1px;height:5px;background:var(--tc);border-radius:0 0 4px 4px;opacity:.85;pointer-events:none}
.gedit{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);min-height:64px}
.grp2{display:flex;align-items:center;gap:6px}
.gedit input[type=range]{width:180px;accent-color:var(--tc)}
.gedit .gdel{margin-left:auto}
.ghint{margin:0;font-family:var(--f-body);font-size:14px;color:var(--soft);line-height:1.4}
.gdrum{display:grid;gap:6px}
.gdrow{display:grid;grid-template-columns:110px repeat(16,minmax(0,1fr));gap:5px}
.gdl{font-size:12px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;min-height:40px}
.gdc{min-height:40px;padding:0;background:#141414;border-color:#2c2c2c}
.gdc.beat{background:#1d1d1d}
.gdc.on{background:var(--tc);border-color:var(--tc)}
.gdc.acc{background:#fff;border-color:#fff;box-shadow:inset 0 0 0 3px var(--tc)}
.gdc.now{outline:2px solid #fff;outline-offset:1px}
.gmix{flex:1;min-height:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;padding:12px}
.gch{--c:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:7px;padding:8px 6px;background:#0b0b0b;min-height:0}
.gch.on{background:#161616}
.gch b{font-family:var(--f-label);font-size:20px;color:var(--c)}
.gch .gen{flex:none;font-size:13px;text-align:center}
.gch input[type=range]{width:100%;accent-color:var(--c)}
.gfad{flex:1;min-height:80px;width:100%;display:flex;justify-content:center}
.gft{position:relative;width:38px;height:100%;background:#000;border:1px solid #333;border-radius:5px;overflow:hidden;touch-action:none;cursor:ns-resize}
.gft i{position:absolute;left:0;right:0;bottom:0;background:var(--c);opacity:.85}
.gms{display:flex;gap:6px}.gms button{min-width:40px;min-height:40px;padding:0}
.gms button.on:first-child{background:#e5c64a;border-color:#e5c64a;color:#000}.gms button.on:last-child{background:#5fd38a;border-color:#5fd38a;color:#000}
.gmaster{--c:var(--ink)}.gsp2{flex:none;height:22px}
@media (max-width:1150px){.brand .gword{display:none}.gtrans .dbox{font-size:13px;padding:0 8px}}
@media (max-width:900px){#plug .gbody{grid-template-columns:110px minmax(0,1fr)}.gcells{display:none}.gviews button{min-width:64px;letter-spacing:.08em}}
.gnew.arm{background:var(--led);border-color:var(--led);color:#fff}

/* engine picker: the engine name on each track, the ENGINE button, and the sheet listing every engine */
.gtop .genb{background:none;border:0;box-shadow:none;padding:4px 2px;min-height:30px;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.1em}
.gtop .genb:hover{color:var(--c)}
.gengb{min-height:42px;padding:0 14px;font-size:14px;letter-spacing:.12em;border-color:var(--tc,var(--line));box-shadow:inset 0 -3px 0 var(--tc,transparent),0 2px 0 #000}
.gpick{width:min(820px,100%)}
.gpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.gpgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:74px;padding:10px 12px;text-align:left;white-space:normal}
.gpgrid button b{font-size:18px;letter-spacing:.12em}
.gpgrid button span{font-family:var(--f-body);font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--soft);line-height:1.25}
.gpgrid button i{font-style:normal;font-size:11px;letter-spacing:.1em;color:var(--tc,var(--led))}
.gpgrid button.on{background:var(--tc,var(--paper));border-color:var(--tc,var(--paper));color:#000}
.gpgrid button.on span,.gpgrid button.on i{color:#000}
.gtop .genb{font-size:14px;letter-spacing:.04em;flex:1;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.gviews button{min-width:76px;letter-spacing:.12em}
.gpats{gap:4px}.gpats button{min-width:36px}
.gbar{gap:8px}
@media (max-width:1250px){.gpats .gcap{display:none}}

<script>
// ===================== Globals rebound for each engine =====================
let D=[],IDX={},P=new Float32Array(0),fmt=()=>'',SRC=[],DST=[],DSTP=[];
let stepEls=[];
function __bind(d,idx,p,f,src,dst,dstp){D=d;IDX=idx;P=p;fmt=f;SRC=src;DST=dst;DSTP=dstp}

// ===================== Widgets =====================
const views=[];  // {i, update()}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function setP(i,v){const d=D[i];v=Math.min(d.mx,Math.max(d.mn,v));P[i]=v;views.forEach(w=>w.i===i&&w.update());send();if(__bubI===i)__bubSet()}
// Touch helpers: a large value read-out while a control is held, two-finger fine adjust, long-press to modulate
let __bubI=-1,__touches=0;const __bub=document.createElement('div');__bub.id='bubble';__bub.hidden=true;
function __bubSet(){__bub.innerHTML='<span>'+D[__bubI].nm+'</span><b>'+fmt(__bubI,P[__bubI])+'</b>'}
function __bubShow(i){__bubI=i;__bubSet();__bub.hidden=false}function __bubHide(){__bubI=-1;__bub.hidden=true}
addEventListener('pointerdown',e=>{if(e.pointerType==='touch')__touches++},true);
['pointerup','pointercancel'].forEach(t=>addEventListener(t,e=>{if(e.pointerType==='touch')__touches=Math.max(0,__touches-1)},true));
function __hold(elm,i){let t=0,x0=0,y0=0;const cancel=()=>{clearTimeout(t);t=0};
  elm.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;cancel();t=setTimeout(()=>{t=0;try{elm.releasePointerCapture(e.pointerId)}catch(_){}__bubHide();__modSheet(i)},520)});
  elm.addEventListener('pointermove',e=>{if(t&&Math.hypot(e.clientX-x0,e.clientY-y0)>7)cancel()});
  ['pointerup','pointercancel'].forEach(n=>elm.addEventListener(n,()=>{cancel();__bubHide()}));
  elm.addEventListener('contextmenu',e=>{e.preventDefault();cancel();__modSheet(i)})}
// Knob skins: the four drawn for the native firmware (VACT, MINI, PRO70, DR8) and this project's own knob for the other engines
let __skin='proj';
const SKIN_BODY={
 vact:'<defs><radialGradient id="kvB" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#4f86d6"/><stop offset="1" stop-color="#173f86"/></radialGradient><radialGradient id="kvC" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#c9ccd1"/><stop offset="1" stop-color="#8d939b"/></radialGradient></defs><circle cx="30" cy="30" r="17.5" fill="url(#kvB)" stroke="#06152e" stroke-width="1"/><circle cx="30" cy="30" r="11" fill="url(#kvC)" stroke="#0f2a55" stroke-width=".8"/>',
 moog:'<defs><radialGradient id="kmC" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#c7cacd"/><stop offset="1" stop-color="#868a8f"/></radialGradient></defs><circle cx="30" cy="30" r="17.5" fill="#141416" stroke="#000" stroke-width="1"/><circle cx="30" cy="30" r="15.5" fill="none" stroke="#2c2c30" stroke-width="2.4" stroke-dasharray="1.4 1.6"/><circle cx="30" cy="30" r="9.5" fill="url(#kmC)" stroke="#000" stroke-width=".7"/>',
 pro:'<defs><radialGradient id="kpB" cx=".38" cy=".3" r=".75"><stop offset="0" stop-color="#3c3c3f"/><stop offset=".55" stop-color="#18181a"/><stop offset="1" stop-color="#0a0a0b"/></radialGradient></defs><circle cx="30" cy="30" r="17" fill="url(#kpB)"/><circle cx="30" cy="30" r="15.6" fill="none" stroke="#cfcfcf" stroke-width="1.1"/><ellipse cx="25.5" cy="22.5" rx="5" ry="2.6" fill="#fff" opacity=".12" transform="rotate(-25 25.5 22.5)"/>',
 drum:'<defs><radialGradient id="kdC" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffc18a"/><stop offset=".55" stop-color="#ef8a3e"/><stop offset="1" stop-color="#c4621f"/></radialGradient></defs><circle cx="30" cy="30" r="17.5" fill="#0d0d10" stroke="#000" stroke-width="1"/><circle cx="30" cy="30" r="15.6" fill="none" stroke="#25252a" stroke-width="2.4" stroke-dasharray="1.3 1.5"/><circle cx="30" cy="30" r="12" fill="url(#kdC)" stroke="#000" stroke-width=".6"/>'};
const SKIN_PTR={
 vact:'<line x1="30" y1="17.5" x2="30" y2="28" stroke="#15181b" stroke-width="2.2" stroke-linecap="round"/>',
 moog:'<circle cx="30" cy="11" r="3" fill="#f4f1e6" stroke="#000" stroke-width=".5"/>',
 pro:'<line x1="30" y1="26.5" x2="30" y2="15.5" stroke="#f4f4f0" stroke-width="1.6" stroke-linecap="round"/>',
 drum:'<line x1="30" y1="23" x2="30" y2="16" stroke="#141414" stroke-width="2.8" stroke-linecap="round"/>'};
function knob(id,blue,name){const i=IDX[id],d=D[i];const c=el('div','ctl');const nm=el('div','nm',name||d.nm),vl=el('div','vl');let k,update;
  if(SKIN_BODY[__skin]){const sk=__skin;let ticks='';for(let j=0;j<11;j++){const a=(-135+27*j)*Math.PI/180,s=Math.sin(a),co=Math.cos(a);
     ticks+=`<line x1="${(30+23*s).toFixed(2)}" y1="${(30-23*co).toFixed(2)}" x2="${(30+28*s).toFixed(2)}" y2="${(30-28*co).toFixed(2)}" stroke-width="2" stroke-linecap="round"/>`}
    k=el('div','fwknob','<svg viewBox="0 0 60 60" aria-hidden="true"><g class="tk">'+ticks+'</g>'+SKIN_BODY[sk]+'<g class="pt">'+SKIN_PTR[sk]+'</g></svg>');
    const tk=k.querySelectorAll('.tk line'),pt=k.querySelector('.pt');
    update=()=>{const t=(P[i]-d.mn)/(d.mx-d.mn);pt.setAttribute('transform','rotate('+(-135+t*270).toFixed(1)+' 30 30)');tk.forEach((l,j)=>l.setAttribute('stroke',j*.1<=t+.002?'#f2efe6':'#3a3a3a'));vl.textContent=fmt(i,P[i])}}
  else{k=el('div','knob');const col=blue?'var(--blue)':'var(--grey)';k.style.background=`radial-gradient(circle at 35% 30%,color-mix(in srgb,${col} 70%,#fff),${col} 55%,color-mix(in srgb,${col} 60%,#000))`;k.appendChild(el('div','cap'));
    update=()=>{const t=(P[i]-d.mn)/(d.mx-d.mn);k.style.transform=`rotate(${-135+t*270}deg)`;vl.textContent=fmt(i,P[i])}}
  k.tabIndex=0;c.append(k,nm,vl);
  let y0=0,last=0;
  k.addEventListener('pointerdown',e=>{const now=Date.now();if(now-last<300){setP(i,d.df);last=0;return}last=now;y0=e.clientY;k.setPointerCapture(e.pointerId);__bubShow(i)});
  k.addEventListener('pointermove',e=>{if(!k.hasPointerCapture(e.pointerId))return;const f=__touches>1||e.shiftKey?.18:1;const dy=y0-e.clientY;y0=e.clientY;setP(i,P[i]+dy/170*(d.mx-d.mn)*f)});
  __hold(k,i);
  k.addEventListener('keydown',e=>{const st=(d.mx-d.mn)/50;if(e.key==='ArrowUp'||e.key==='ArrowRight'){setP(i,P[i]+st);e.preventDefault()}if(e.key==='ArrowDown'||e.key==='ArrowLeft'){setP(i,P[i]-st);e.preventDefault()}});
  views.push({i,update});update();c.dataset.p=id;return c}
function select(id,name){const i=IDX[id],d=D[i];const c=el('div','ctl sl');const s=el('select');s.id='sel-'+id;s.setAttribute('aria-label',name||d.nm);
  d.ch.forEach((t,j)=>{const o=el('option',null,t);o.value=j;s.appendChild(o)});s.onchange=()=>setP(i,+s.value);

// ---------- the sequencer: scheduled 120 ms ahead, sent to the engines with their time ----------

  playing=true;stepN=0;patStartN=0;gridT=ctx.currentTime+.08;recent.length=0;
  T.forEach(tr=>{if(!tr.syn)return;if(tr.eng==='dr8')drumPlay(tr,true,gridT);tr.syn.port.postMessage({t:'xstart',at:gridT})});
  sched();timer=setInterval(sched,20);drawTransport()}

  T.forEach(tr=>{if(!tr.syn)return;if(tr.eng==='dr8')drumPlay(tr,false);tr.syn.port.postMessage({t:'xoff'});tr.syn.port.postMessage({t:'alloff'})});

// live recording: a note lands on the nearest step, its length is how long the key was held
const heldRec=new Map();
function nearest(){const now=ctx.currentTime;let b=null;recent.forEach(r=>{if(!b||Math.abs(r.t-now)<Math.abs(b.t-now))b=r});return b}

  if(m.t==='hit'){const b=nearest();if(!b)return;const s=((b.n-patStartN)%NST+NST)%NST;tr.ep[META.dr8.IDX['p'+m.tr+'_'+s]]=1;if(tr.syn)tr.syn.port.postMessage({t:'p',p:tr.ep});dirty();if(view.kind==='pat')drawPat();return}

  if(m.t==='pad'||m.t==='padoff'){if(tr.eng!=='sp64'||Math.round(tr.ep[META.sp64.IDX.chrom])>0)return;m={t:m.t==='pad'?'on':'off',n:36+m.k,v:m.v}}
  if(m.t==='on'){const b=nearest();if(!b)return;const p=tr.pats[song.pat];const s=((b.n-patStartN)%p.len+p.len)%p.len;const x={n:m.n,v:m.v==null?.85:m.v,l:1};

function drawRail(){T.forEach((tr,t)=>{const e=railEls[t];if(!e)return;e.r.classList.toggle('on',t===view.t);e.en.textContent=META[tr.eng].name+(META[tr.eng].name.length<7?' \u25BE':'');e.en.setAttribute('aria-label','Track '+(t+1)+' engine: '+META[tr.eng].name+'. Change it');e.ms.classList.toggle('on',tr.mute);e.ss.classList.toggle('on',tr.solo);
  e.r.classList.toggle('muted',tr.mute||(T.some(x=>x.solo)&&!tr.solo));const st=stepsOf(tr);e.cells.forEach((c,k)=>{c.className=st[k]<0?'off':st[k]?'hit':''})});drawPlayheads()}
function drawPlayheads(){T.forEach((tr,t)=>{const e=railEls[t];if(!e)return;const len=tr.eng==='dr8'?NST:tr.pats[song.pat].len;const s=curStep<0?-1:((curStep-patStartN)%len+len)%len;e.cells.forEach((c,k)=>c.classList.toggle('now',k===s))});
  if(view.kind==='pat'&&patCells.length){const tr=T[view.t];const len=tr.eng==='dr8'?NST:tr.pats[song.pat].len;const s=curStep<0?-1:((curStep-patStartN)%len+len)%len;patCells.forEach(c=>c.el.classList.toggle('now',c.k===s))}}
function flashRail(t){const e=railEls[t];if(!e)return;e.r.classList.add('flash');clearTimeout(e.ft);e.ft=setTimeout(()=>e.r.classList.remove('flash'),90)}

// ---------- showing a track ----------
function show(t,kind){const prevT=view.t;view.t=t;view.kind=kind;if(prevT!==t)selStep=-1;const tr=T[t];plug.dataset.gv=kind;plug.style.setProperty('--tc',COL[t]);
  [...vtabs.children].forEach(b=>b.classList.toggle('on',b.dataset.k===kind));
  if(window.__SMP)__SMP.inst='g'+t;
  if(kind==='syn'||kind==='fx'){const id=kind==='fx'?'fx':tr.eng;switching=true;clearSaved();pendingVals=kind==='fx'?tr.fp:tr.ep;
    try{switchEngine(id)}finally{switching=false}clearSaved();if(kind==='fx')tr.fp=P;else tr.ep=P;node=routed;
    engName.textContent='TRACK '+(t+1)+' · '+(kind==='fx'?'FX':META[tr.eng].name);engDesc.textContent=kind==='fx'?'8-box effect chain after '+META[tr.eng].name:META[tr.eng].def.desc}
  else{const id=tr.eng;if(__eng&&__eng.id!==id){switching=true;clearSaved();pendingVals=tr.ep;try{switchEngine(id)}finally{switching=false}clearSaved();tr.ep=P;node=routed}
    if(kind==='pat')drawPat();else drawMix()}
  engB.textContent='ENGINE \u00B7 '+META[tr.eng].name+' \u25BE';
  drawRail();drawPatBtns();__lastKey='';__applyMode(true)}

// ---------- PATTERN view ----------
let patCells=[];
const engSel=()=>{const s=el('select','gsel');s.setAttribute('aria-label','Engine of this track');SYN.forEach(id=>{const o=el('option',null,META[id].name+' — '+META[id].def.desc);o.value=id;s.appendChild(o)});return s};
let clip=null;
function drawPat(){const t=view.t,tr=T[t];gpanel.innerHTML='';patCells=[];const p=tr.pats[song.pat];
  const wt=el('div','wt');wt.innerHTML='<i></i>';wt.appendChild(el('span',null,'TRACK '+(t+1)+' · PATTERN '+PATN[song.pat]));wt.appendChild(el('div','grow'));
  const es=engSel();es.value=tr.eng;es.onchange=()=>setEngine(t,es.value);wt.appendChild(es);gpanel.appendChild(wt);
  const body=el('div','gpb');gpanel.appendChild(body);
  const tools=el('div','gtools');body.appendChild(tools);
  const btn=(txt,fn,cls)=>{const b=el('button',cls||null,txt);b.onclick=fn;tools.appendChild(b);return b};
  if(tr.eng!=='dr8'){
    tools.appendChild(el('span','gcap','LENGTH'));btn('−',()=>{p.len=Math.max(1,p.len-1);dirty();drawPat();drawRail()});tools.appendChild(el('span','gval',String(p.len)));btn('+',()=>{p.len=Math.min(NST,p.len+1);dirty();drawPat();drawRail()});
    tools.appendChild(el('span','gsp'));
    btn('TRANSPOSE −',()=>{p.steps.forEach(s=>s&&s.forEach(x=>x.n=Math.max(0,x.n-1)));dirty();drawPat()});btn('+',()=>{p.steps.forEach(s=>s&&s.forEach(x=>x.n=Math.min(127,x.n+1)));dirty();drawPat()})}
  tools.appendChild(el('div','grow'));
  btn('COPY',()=>{clip=tr.eng==='dr8'?{drum:DRUMI.map(i=>tr.ep[i])}:{pat:JSON.parse(JSON.stringify(p))};drawPat()});
  const pb=btn('PASTE',()=>{if(!clip)return;if(clip.drum&&tr.eng==='dr8'){DRUMI.forEach((i,k)=>tr.ep[i]=clip.drum[k]);if(tr.syn)tr.syn.port.postMessage({t:'p',p:tr.ep})}
    else if(clip.pat&&tr.eng!=='dr8')tr.pats[song.pat]=JSON.parse(JSON.stringify(clip.pat));dirty();drawPat();drawRail();drawPatBtns()});pb.disabled=!clip||(!!clip.drum)!==(tr.eng==='dr8');
  btn('CLEAR',()=>{if(tr.eng==='dr8'){DRUMI.forEach(i=>tr.ep[i]=0);if(tr.syn)tr.syn.port.postMessage({t:'p',p:tr.ep})}else tr.pats[song.pat]=emptyPat();selStep=-1;dirty();drawPat();drawRail();drawPatBtns()});
  if(tr.eng==='dr8'){drawDrumGrid(body,tr);return}
  // 16 steps
  const grid=el('div','gsteps');body.appendChild(grid);
  for(let k=0;k<NST;k++){const st=p.steps[k];const c=el('button','gstep'+(st&&st.length?' hit':'')+(k===selStep?' sel':'')+(k>=p.len?' out':'')+(k%4===0?' beat':''));
    c.setAttribute('aria-label','Step '+(k+1)+(st&&st.length?' '+st.map(x=>nn(x.n)).join(' '):' empty'));
    c.appendChild(el('span','gk',String(k+1)));
    if(st&&st.length){c.appendChild(el('span','gn',st.map(x=>nn(x.n)).join(' ')));const vb=el('span','gvb');const vi=el('i');vi.style.height=(st[0].v*100)+'%';vb.appendChild(vi);c.appendChild(vb);
      if(st[0].l>1){const lb=el('span','gl');lb.style.width='calc('+(Math.min(st[0].l,NST-k))*100+'% + '+(Math.min(st[0].l,NST-k)-1)*6+'px)';c.appendChild(lb)}}
    c.onclick=()=>{if(k>=p.len)return;if(!st||!st.length){p.steps[k]=[{n:tr.lastNote,v:.8,l:1}];selStep=k;if(ctx&&tr.syn&&!playing){tr.syn.port.postMessage({t:'on',n:tr.lastNote,v:.8});tr.syn.port.postMessage({t:'off',n:tr.lastNote,at:ctx.currentTime+stepDur()})}}
      else if(selStep===k){p.steps[k]=null;selStep=-1}else selStep=k;dirty();drawPat();drawRail();drawPatBtns()};
    grid.appendChild(c);patCells.push({k,el:c})}
  // the selected step
  const ed=el('div','gedit');body.appendChild(ed);const st=selStep>=0?p.steps[selStep]:null;
  if(!st||!st.length){ed.appendChild(el('p','ghint',playing&&rec?'Recording: play the keyboard, notes land on the nearest step.':'Tap a step to add a note ('+nn(tr.lastNote)+'), tap it again to select, a third time to remove it. With a step selected, keys on the keyboard set its note (hold several for a chord). REC + PLAY records what you play.'));return}
  ed.appendChild(el('span','gcap','STEP '+(selStep+1)));
  const row=(cap,items)=>{const g=el('div','grp2');g.appendChild(el('span','gcap',cap));items.forEach(x=>g.appendChild(x));ed.appendChild(g)};
  const b2=(txt,fn)=>{const b=el('button',null,txt);b.onclick=()=>{fn();tr.lastNote=st[0].n;dirty();drawPat();drawRail()};return b};
  row('NOTE',[b2('−12',()=>st.forEach(x=>x.n=Math.max(0,x.n-12))),b2('−1',()=>st.forEach(x=>x.n=Math.max(0,x.n-1))),el('span','gval',st.map(x=>nn(x.n)).join(' ')),b2('+1',()=>st.forEach(x=>x.n=Math.min(127,x.n+1))),b2('+12',()=>st.forEach(x=>x.n=Math.min(127,x.n+12)))]);
  const vel=el('input');vel.type='range';vel.min=.05;vel.max=1;vel.step=.01;vel.value=st[0].v;vel.setAttribute('aria-label','Velocity');vel.oninput=()=>{st.forEach(x=>x.v=+vel.value);vv.textContent=Math.round(vel.value*100);dirty()};vel.onchange=()=>drawPat();
  const vv=el('span','gval',String(Math.round(st[0].v*100)));row('VELOCITY',[vel,vv]);
  const L=[.25,.5,1,2,4,8,16];row('LENGTH',L.map(l=>{const b=b2(l<1?'1/'+(1/l):String(l),()=>st.forEach(x=>x.l=l));b.classList.toggle('on',st[0].l===l);return b}));
  const del=el('button','gdel','REMOVE');del.onclick=()=>{p.steps[selStep]=null;selStep=-1;dirty();drawPat();drawRail()};ed.appendChild(del)}
// DR8 tracks: the drum grid itself (off, on, accent), saved per pattern
function drawDrumGrid(body,tr){const m=META.dr8;const g=el('div','gdrum');body.appendChild(g);
  const kitN=r=>{const ki=Math.round(tr.ep[m.IDX['t'+r+'kit']]),ii=Math.round(tr.ep[m.IDX['t'+r+'inst']]);const d=m.D[m.IDX['t'+r+'inst']];return (d&&d.ch?d.ch[ii]:'T'+(r+1))};
  for(let r=0;r<8;r++){const row=el('div','gdrow');const lab=el('button','gdl',kitN(r));lab.onclick=()=>{if(ctx&&tr.syn)tr.syn.port.postMessage({t:'hit',tr:r})};row.appendChild(lab);
    for(let k=0;k<NST;k++){const i=m.IDX['p'+r+'_'+k];const v=Math.round(tr.ep[i]);const c=el('button','gdc'+(v===1?' on':v===2?' acc':'')+(k%4===0?' beat':''));c.setAttribute('aria-label','Track '+(r+1)+' step '+(k+1));
      c.onclick=()=>{tr.ep[i]=(Math.round(tr.ep[i])+1)%3;if(tr.syn)tr.syn.port.postMessage({t:'p',p:tr.ep});dirty();drawPat();drawRail();drawPatBtns()};row.appendChild(c);patCells.push({k,el:c})}
    g.appendChild(row)}
  body.appendChild(el('p','ghint','Tap a cell: on, accent, off. Tap a sound name to hear it. Its sounds, kits and tuning are on SYNTH; REC + PLAY records the pads.'))}

// choosing a track's engine: every engine with what it is; the track keeps each engine's settings if you come back to it
function enginePicker(t){const tr=T[t];const bg=el('div','sheetbg');const sh=el('div','sheet gpick');sh.setAttribute('role','dialog');sh.setAttribute('aria-label','Engine of track '+(t+1));
  const hd=el('div','shd');hd.appendChild(el('b',null,'TRACK '+(t+1)+' \u00B7 ENGINE'));const x=el('button','shx','CLOSE');hd.appendChild(x);sh.appendChild(hd);
  const g=el('div','gpgrid');SYN.forEach(id=>{const b=el('button',id===tr.eng?'on':null);b.appendChild(el('b',null,META[id].name));b.appendChild(el('span',null,META[id].def.desc));
    if(tr.cache[id])b.appendChild(el('i',null,'your settings'));b.onclick=()=>{close();setEngine(t,id)};g.appendChild(b)});sh.appendChild(g);
  sh.appendChild(el('p','shn','The track keeps its pattern, FX and mix. Each engine you used on this track keeps its settings, so switching back finds them again.'));
  const close=()=>{bg.remove();removeEventListener('keydown',esc)};const esc=e=>{if(e.key==='Escape')close()};
  x.onclick=close;bg.onclick=e=>{if(e.target===bg)close()};addEventListener('keydown',esc);bg.appendChild(sh);document.body.appendChild(bg);const f=g.querySelector('.on')||g.firstChild;f&&f.focus()}
function setEngine(t,id){const tr=T[t];if(tr.eng===id)return;tr.cache[tr.eng]=tr.ep;if(tr.eng==='dr8')tr.drum[song.pat]=DRUMI.map(i=>tr.ep[i]);
  tr.eng=id;tr.ep=tr.cache[id]||Float32Array.from(META[id].df);delete tr.cache[id];
  if(id==='dr8'){const g=tr.drum[song.pat];if(g)DRUMI.forEach((i,k)=>tr.ep[i]=g[k])}
  if(ctx)buildSyn(t);selStep=-1;dirty();show(t,view.kind)}

// ---------- MIX view ----------
function vfader(get,set,label,color){const w=el('div','gfad');const tr_=el('div','gft');tr_.tabIndex=0;tr_.setAttribute('role','slider');tr_.setAttribute('aria-label',label);const f=el('i');if(color)f.style.background=color;tr_.appendChild(f);w.appendChild(tr_);
  const up=()=>{f.style.height=(get()*100)+'%'};const setE=e=>{const r=tr_.getBoundingClientRect();set(Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height)));up()};
  tr_.addEventListener('pointerdown',e=>{tr_.setPointerCapture(e.pointerId);setE(e)});tr_.addEventListener('pointermove',e=>{if(tr_.hasPointerCapture(e.pointerId))setE(e)});
  tr_.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){set(Math.min(1,Math.max(0,get()+(e.key==='ArrowUp'?.02:-.02))));up();e.preventDefault()}});up();return w}
function drawMix(){gpanel.innerHTML='';const wt=el('div','wt');wt.innerHTML='<i></i>MIXER';gpanel.appendChild(wt);const body=el('div','gmix');gpanel.appendChild(body);
  T.forEach((tr,t)=>{const s=el('div','gch'+(t===view.t?' on':''));s.style.setProperty('--c',COL[t]);s.appendChild(el('b',null,String(t+1)));s.appendChild(el('span','gen',META[tr.eng].name));
    const pan=el('input');pan.type='range';pan.min=-1;pan.max=1;pan.step=.01;pan.value=tr.pan;pan.setAttribute('aria-label','Pan track '+(t+1));pan.ondblclick=()=>{pan.value=0;pan.oninput()};
    pan.oninput=()=>{tr.pan=+pan.value;mixApply();dirty()};s.appendChild(el('span','gcap','PAN'));s.appendChild(pan);
    s.appendChild(vfader(()=>tr.vol,v=>{tr.vol=v;mixApply();dirty()},'Volume track '+(t+1),COL[t]));
    const ms=el('div','gms');const m=el('button',tr.mute?'on':'','M'),so=el('button',tr.solo?'on':'','S');m.onclick=()=>{tr.mute=!tr.mute;mixApply();drawMix();drawRail();dirty()};so.onclick=()=>{tr.solo=!tr.solo;mixApply();drawMix();drawRail();dirty()};
    ms.append(m,so);s.appendChild(ms);s.onclick=e=>{if(e.target===s||e.target.tagName==='B'){view.t=t;drawMix();drawRail()}};body.appendChild(s)});
  const mm=el('div','gch gmaster');mm.appendChild(el('b',null,'MAIN'));mm.appendChild(el('span','gen','OUT'));mm.appendChild(el('span','gcap',''));mm.appendChild(el('span','gsp2'));
  mm.appendChild(vfader(()=>song.master,v=>{song.master=v;mixApply();dirty()},'Main volume','var(--ink)'));body.appendChild(mm)}

// ---------- start ----------
document.querySelector('#plug header .ekeys').hidden=true;
const nb=el('button','gnew','NEW');nb.title='Start a new song (clears every track)';let nbT=0;nb.onclick=()=>{if(!nb.classList.contains('arm')){nb.classList.add('arm');nb.textContent='TAP AGAIN TO CLEAR';clearTimeout(nbT);nbT=setTimeout(()=>{nb.classList.remove('arm');nb.textContent='NEW'},3000);return}
  clearTimeout(nbT);nb.classList.remove('arm');nb.textContent='NEW';stop();
  T.forEach(tr=>{try{tr.syn&&tr.syn.disconnect()}catch(e){}});const old=T;demo();T.forEach((tr,t)=>{Object.assign(tr,{fx:old[t].fx,gain:old[t].gain,panN:old[t].panN,an:old[t].an,syn:null});if(tr.fx)tr.fx.port.postMessage({t:'p',p:tr.fp})});
  if(window.__SMP)for(let t=0;t<NT;t++)__SMP.drop('g'+t);
  song={bpm:112,swing:0,master:.8,pat:0};if(ctx)T.forEach((_,t)=>buildSyn(t));mixApply();dirty();buildRail();show(0,'pat')};
playB.parentNode.appendChild(nb);
try{clkFollow=false}catch(e){}
window.__resampleSources=()=>ctx&&limiter?[{label:'MIX',node:limiter},...T.map((tr,t)=>({label:'TRACK '+(t+1)+' '+META[tr.eng].name,node:tr.panN}))]:[];
__viewPref='touch';viewBtn.hidden=true;
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&!(__eng&&__eng.pads&&view.kind==='syn')){e.preventDefault();playing?stop():play()}});
addEventListener('pagehide',saveNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
buildRail();show(0,'pat');__applyMode(true);
window.__groove={T,META,show,play,stop,get playing(){return playing},song:()=>song};
})();

</script>
